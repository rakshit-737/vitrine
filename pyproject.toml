[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrine"
version = "0.1.0"
description = "Static-first, explainable PE triage with auto-synthesized YARA rules (never executes samples)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
yara = ["yara-python>=4.3"]

[project.scripts]
vitrine = "vitrine.cli:main"

[tool.setuptools]
packages = ["vitrine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
