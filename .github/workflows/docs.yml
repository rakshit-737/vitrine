name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . -r docs/requirements.txt
      - run: python -m mkdocs build --strict
      - name: Parse every mermaid block
        run: |
          mkdir -p /tmp/mmd && echo '{"args":["--no-sandbox"]}' > /tmp/mmd/p.json
          python - <<'PY'
          import pathlib, re
          n = 0
          for f in ["README.md", *map(str, pathlib.Path("docs").rglob("*.md"))]:
              for b in re.findall(r"```mermaid\s*\n(.*?)```", pathlib.Path(f).read_text(encoding="utf-8"), re.S):
                  n += 1
                  pathlib.Path(f"/tmp/mmd/{n}.mmd").write_text(b)
          print(n, "mermaid blocks")
          PY
          for f in /tmp/mmd/*.mmd; do npx -y @mermaid-js/mermaid-cli@11 -p /tmp/mmd/p.json -i "$f" -o "$f.svg"; done
      - name: Build the preprint PDF
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          root_file: main.tex
          working_directory: paper
      - name: Publish it with the site
        run: |
          mkdir -p site/paper && cp paper/main.pdf site/paper/vitrine-preprint.pdf
          test "$(stat -c %s site/paper/vitrine-preprint.pdf)" -lt 5000000
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
