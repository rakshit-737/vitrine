name: paper
on:
  push:
    paths: ["paper/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          root_file: main.tex
          working_directory: paper
      - uses: actions/upload-artifact@v4
        with:
          name: vitrine-preprint
          path: paper/main.pdf
