name: ember2017-repro
# Reproduces the EMBER paper's LightGBM baseline (EMBER 2017, feature v1, LightGBM defaults).
# Downloads the 1.67 GB feature archive (features only, no binaries) inside the runner.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      - name: Install the paper-era stack
        run: |
          python -m pip install "numpy==1.21.6" "scipy==1.7.3" "scikit-learn==0.24.2" "lightgbm==2.3.1" "pandas==1.3.5" "tqdm==4.66.4"
          mkdir -p stub/lief && echo '__version__ = "0.8.3-stub-never-called"' > stub/lief/__init__.py
      - name: Fetch elastic/ember pinned
        run: |
          git clone --quiet https://github.com/elastic/ember.git ember_src
          git -C ember_src checkout --quiet d97a0b523de02f3fe5ea6089d080abacab6ee931
      - name: Download and verify EMBER 2017 v1 features
        run: |
          curl -sSfL --retry 5 -o ember_dataset.tar.bz2 https://ember.elastic.co/ember_dataset.tar.bz2
          echo "a5603de2f34f02ab6e21df7a0f97ec4ac84ddc65caee33fb610093dd6f9e1df9  ember_dataset.tar.bz2" | sha256sum -c -
          tar -xjf ember_dataset.tar.bz2 && rm ember_dataset.tar.bz2
          D=$(dirname "$(find . -name test_features.jsonl | head -1)"); echo "DATA=$D" >> "$GITHUB_ENV"; ls -la "$D"; df -h /
      - name: Vectorize, train, score
        env:
          PYTHONPATH: ${{ github.workspace }}/stub
        run: |
          python scripts/repro_ember2017.py --data "$DATA" --ember-src ember_src --out ember2017_repro.json \
            --sha256 a5603de2f34f02ab6e21df7a0f97ec4ac84ddc65caee33fb610093dd6f9e1df9
      - uses: actions/upload-artifact@v4
        with:
          name: ember2017-repro
          path: ember2017_repro.json
