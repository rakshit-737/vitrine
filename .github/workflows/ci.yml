name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q -m "not realdata"
      - run: python -m vitrine demo
      - name: Dependency audit
        if: matrix.python == '3.12'
        run: python -m pip install pip-audit && pip-audit --skip-editable
  windows-system32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m realdata -k system32
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # same pinned actions as release.yml, so a broken bump shows up before a tag
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: vitrine:ci
      - name: Smoke-test the container
        run: |
          docker run -d --name vitrine-smoke -p 127.0.0.1:8000:8000 vitrine:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs vitrine-smoke; exit 1
